<html>
    <head>
        <title>Registros de clientes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        
    <center><h1>Registro de clientes</h1></center><br>
    
        <p th:if="${error}" th:text="${error}"></p>
 
 
        <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post">
            <input type="hidden" th:field="*{id}">
            <label style ="margin-left: 20px">NIT:</label><br>
            <input style ="margin-left: 20px" type="text" th:field="*{nit}"><br>
            <br><label style ="margin-left: 20px">Nombre:</label>
            <input style ="margin-left: 20px" type="text" class="form-control" th:field="*{nombre}"><br>
            <label style ="margin-left: 20px">Apellidos</label>
            <input style ="margin-left: 20px" type="text" class="form-control" th:field="*{apellidos}"><br>
            <label style ="margin-left: 20px">Email</label>
            <input style ="margin-left: 20px" type="text" class="form-control" th:field="*{email}"><br>
            <button style ="margin-left: 20px" class="btn btn-primary" type="submit">Guardar</button>
        </form>
 
        <br><table class="table table-striped">
            <tr>
                <th>ID</th>
                <th>NIT</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Email</th>
                <th>Acciones</th>
            </tr>
 
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nit}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.apellidos}"></td>
                <td th:text="${c.email}"></td>
                <td>
                    <a class="btn btn-success" th:href="@{/cliente/editar/{id}(id=${c.id})}">Editar</a>
                    <form th:action="@{/cliente/eliminar/{id}(id=${c.id})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
