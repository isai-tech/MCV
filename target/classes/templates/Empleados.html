<html>
    <head>
        <title>Registros de Empleados</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
 
    <center><h1>Registro de empleados</h1></center><br>
 
        <p th:if="${error}" th:text="${error}"></p>
 
        <form th:action="@{/empleado/guardar}" th:object="${empleado}" method="post">
            <input type="hidden" th:field="*{id}">
 
            <label style ="margin-left: 10px">Puesto:</label>
            <select th:field="*{idPuesto}">
                <option th:each="puesto : ${puestosDisponibles}"
                        th:value="${puesto.idPuesto}"
                        th:text="${puesto.nombre}"></option>
            </select>
 
            <label style ="margin-left: 10px">Nombre:</label>
            <input type="text" th:field="*{nombre}">
 
            <label style ="margin-left: 10px">Apellidos:</label>
            <input type="text" th:field="*{apellidos}">
 
            <label style ="margin-left: 10px">Fecha de contratación:</label>
            <input type="date" th:field="*{fechaContratacion}">
 
            <button style ="margin-left: 40px" class="btn btn-primary" type="submit">Guardar</button>
        </form><br>
 
        <br><table  class="table table-hover">
            <tr>
                <th>ID</th>
                <th>Puesto</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Fecha contratación</th>
                <th>Acciones</th>
            </tr>
 
            <tr th:each="e : ${empleados}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.idPuesto}"></td>
                <td th:text="${e.nombre}"></td>
                <td th:text="${e.apellidos}"></td>
                <td th:text="${e.fechaContratacion}"></td>
                <td>
                    <a class="btn btn-success" th:href="@{/empleado/editar/{id}(id=${e.id})}">Editar</a>
                    <form th:action="@{/empleado/eliminar/{id}(id=${e.id})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
