<html>
    <head>
        <title>Registros de Marcas</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
 
    <center><h1>Registro de marcas</h1></center><br>
 
        <p th:if="${error}" th:text="${error}"></p>
 
        <form th:action="@{/marca/guardar}" th:object="${marca}" method="post">
            <input type="hidden" th:field="*{idMarca}">
            <label style ="margin-left: 20px">Nombre:</label>
            <input style ="margin-left: 20px" type="text" th:field="*{nombre}"><br>
            <br><button class="btn btn-primary" type="submit">Guardar</button><br>
        </form>
 
        <br><table class="table table-striped-columns">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
 
            <tr th:each="m : ${marcas}">
                <td th:text="${m.idMarca}"></td>
                <td th:text="${m.nombre}"></td>
                <td>
                    <a class="btn btn-success" th:href="@{/marca/editar/{id}(id=${m.idMarca})}">Editar</a>
                    <form th:action="@{/marca/eliminar/{id}(id=${m.idMarca})}" method="post">
                        <button class="btn btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
